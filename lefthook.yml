pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx}'
      run: npx oxlint --report-unused-disable-directives {staged_files}
    format:
      glob: '*.{ts,tsx,json,yml}'
      run: npx prettier --check {staged_files}
    typecheck:
      run: npm run typecheck

pre-push:
  commands:
    check:
      run: npm run check
